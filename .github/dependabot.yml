# Dependabot: abre PRs automaticamente quando uma biblioteca fica desatualizada
# ou tem vulnerabilidade conhecida. Cada PR passa pelo CI como qualquer outro.
# As atualizações são agrupadas: no máximo um PR por semana para cada tipo.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      pub:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
