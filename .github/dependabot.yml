# Dependabot: abre PRs automaticamente quando uma biblioteca fica desatualizada
# ou tem vulnerabilidade conhecida. Cada PR passa pelo CI como qualquer outro.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
