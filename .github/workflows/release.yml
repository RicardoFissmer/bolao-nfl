# Releases automáticas (release-please).
# A cada merge na main, o robô lê os commits (Conventional Commits) e mantém
# aberto um "PR de release" com a próxima versão e o CHANGELOG.
# Quando esse PR é mesclado, ele cria a tag SemVer (a baseline) e a Release no
# GitHub, e este workflow anexa o APK a ela.
#
# Observação: o CI do PR de release só roda depois que alguém clica em
# "Approve workflows to run" no próprio PR (trava do GitHub para PRs de robôs).
name: Release

on:
  push:
    branches: [main]
  # Permite anexar o APK manualmente a uma release já existente (aba Actions).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release para anexar o APK (ex.: v1.0.0)"
        required: true

permissions:
  contents: write # criar tag, release e enviar o APK
  pull-requests: write # abrir/atualizar o PR de release

jobs:
  release-please:
    name: Preparar release
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Rodar o release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  attach-apk:
    name: Anexar APK à release
    needs: release-please
    # always(): roda mesmo quando o job anterior foi pulado (execução manual).
    if: >-
      ${{ always() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Baixar o código da tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Build APK
        run: flutter build apk --release

      - name: Enviar APK para a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "bolao-nfl-$TAG.apk"
          gh release upload "$TAG" "bolao-nfl-$TAG.apk" --clobber --repo "${{ github.repository }}"
